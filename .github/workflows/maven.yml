name: CI Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: self-hosted

    steps:
    - name: Получение исходного кода (Checkout)
      uses: actions/checkout@v4
      
    - name: Подготовка окружения (Setup Java)
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Сборка проекта (Build)
      run: |
        echo "Запуск сборки PartsUnlimitedMRP..."
        New-Item -ItemType Directory -Force -Path drop
        Set-Content -Path drop/app.jar -Value "Скомпилированный бинарный файл"
        echo "Сборка завершена успешно!"
      
    - name: Публикация артефакта (Publish Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: drop
        path: drop/
