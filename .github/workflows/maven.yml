name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: self-hosted
    steps:
    - name: Получение исходного кода
      uses: actions/checkout@v4
      
    - name: Сборка проекта (Build)
      run: |
        echo "Starting build PartsUnlimitedMRP..."
        New-Item -ItemType Directory -Force -Path drop
        Set-Content -Path drop/app.zip -Value "Скомпилированный ZIP-пакет веб-приложения"
        echo "Build completed successfully!"
      
    - name: Publish build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: drop
        path: drop/

  test:
    runs-on: self-hosted
    needs: build
    steps:
    - name: Получение исходного кода
      uses: actions/checkout@v4
      
    - name: Запуск автотестов
      run: ./test_math.ps1

  deploy:
    runs-on: self-hosted
    needs: test
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: drop
        path: drop/

    - name: Развертывание службы приложений
      run: |
        echo "Авторизация в облачной среде..."
        echo "Загрузка пакета drop/app.zip на целевой сервер..."
        echo "Развертывание завершено успешно! Имитация веб-сайта запущена."
